# Monitoring overlay (item #6): Prometheus + Alertmanager + Grafana, running
# INSIDE the compose network so they can reach the backend's deliberately
# unpublished /metrics. Apply on top of dev or prod:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.monitoring.yml up -d
#
# All UIs bind to 127.0.0.1 on the HOST (SSH-tunnel access, never exposed):
#   Prometheus   http://127.0.0.1:9090  (targets, /alerts)
#   Alertmanager http://127.0.0.1:9093  (configure a receiver — see
#                                       deploy/monitoring/alertmanager.yml)
#   Grafana      http://127.0.0.1:3001  (admin / $GRAFANA_ADMIN_PASSWORD,
#                                       dashboard auto-provisioned)
services:
  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    depends_on:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
