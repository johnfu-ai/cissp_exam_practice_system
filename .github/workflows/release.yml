name: Release

# Release pipeline (audit idea #2): versioned, installable artifacts +
# registry-pushed server images. Triggered by pushing a `v*` tag
# (e.g. `git tag v1.3.0 && git push origin v1.3.0`).
#
# Required repository configuration:
#   Secret ANDROID_KEYSTORE_BASE64     — base64 of the upload keystore (.jks)
#   Secret ANDROID_STORE_PASSWORD
#   Secret ANDROID_KEY_ALIAS
#   Secret ANDROID_KEY_PASSWORD
#   Variable PROD_API_BASE_URL         — e.g. https://api.example.com
#
# Without those the Android job fails with a clear error instead of silently
# producing a debug-signed build; set the variable and secrets under
# Settings → Secrets and variables → Actions before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3.1) — dry-run builds, no GH release"
        required: true
        type: string

permissions:
  contents: write # create the GitHub release
  packages: write # push images to ghcr.io

env:
  FLUTTER_VERSION: "3.32.8"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-tag: ${{ steps.v.outputs.is-tag }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is-tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require PROD_API_BASE_URL variable
        env:
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
        run: |
          if [ -z "$PROD_API_BASE_URL" ]; then
            echo "::error::Set the repository variable PROD_API_BASE_URL (Settings → Secrets and variables → Actions → Variables) to the production API origin."
            exit 1
          fi

  android:
    name: Android (signed release)
    runs-on: ubuntu-latest
    needs: meta
    env:
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fail fast without signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 (and ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) must be set to cut a signed release."
            exit 1
          fi
      - name: Materialize signing config
        working-directory: mobile/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF
      - name: Build signed release APK + AAB
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release \
            --build-name=${{ needs.meta.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=$PROD_API_BASE_URL \
            --dart-define=APP_ENV=production
          flutter build appbundle --release \
            --build-name=${{ needs.meta.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=$PROD_API_BASE_URL \
            --dart-define=APP_ENV=production
          mv build/app/outputs/flutter-apk/app-release.apk \
             cissp-compass-${{ needs.meta.outputs.version }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            mobile/cissp-compass-*-android.apk
            mobile/build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows (release zip)
    runs-on: windows-latest
    needs: meta
    env:
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows release
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build windows --release `
            --build-name=${{ needs.meta.outputs.version }} `
            --build-number=${{ github.run_number }} `
            --dart-define=API_BASE_URL=$env:PROD_API_BASE_URL `
            --dart-define=APP_ENV=production
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath cissp-compass-${{ needs.meta.outputs.version }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: mobile/cissp-compass-*-windows-x64.zip

  ios:
    name: iOS (release compile, unsigned)
    runs-on: macos-latest
    needs: meta
    env:
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build iOS release (no codesign)
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.meta.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=$PROD_API_BASE_URL \
            --dart-define=APP_ENV=production
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app \
            ../../../cissp-compass-${{ needs.meta.outputs.version }}-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: mobile/cissp-compass-*-ios-unsigned.zip
      - name: Note on installability
        run: echo "Unsigned build — proves release compilation. TestFlight/App Store needs Apple certs + provisioning profiles on the runner; see docs/ops/production-runbook.md."

  docker:
    name: Server images (ghcr.io)
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-backend:latest
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:latest

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [meta, android, windows, ios, docker]
    if: needs.meta.outputs.is-tag == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: List artifacts
        run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.zip
          body: |
            CISSP Compass ${{ needs.meta.outputs.version }}

            - Android APK/AAB: signed with the upload keystore, built with
              `APP_ENV=production` (dev conveniences compiled out).
            - Windows x64 zip: unsigned release build (MSIX/store signing is a
              follow-up; see `docs/ops/production-runbook.md`).
            - iOS zip: unsigned release compile — for TestFlight/App Store the
              Apple certs must be installed on the runner first.
            - Server images: `ghcr.io/${{ github.repository }}-backend:${{ needs.meta.outputs.version }}`
              and `...-frontend:${{ needs.meta.outputs.version }}` (also `:latest`).

            Rollback: re-deploy the compose stack with the previous image tag.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
