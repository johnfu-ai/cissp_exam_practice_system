name: CI

on:
  push:
    branches: [master, "fix/**", "feat/**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cissp
          POSTGRES_PASSWORD: cissp
          POSTGRES_DB: cissp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cissp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://cissp:cissp@localhost:5432/cissp
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (incl. no-autogenerate-drift guard + coverage threshold)
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check OpenAPI schema freshness (#32)
        working-directory: backend
        run: |
          python -m app.scripts.export_openapi ../openapi/openapi.json
          git diff --exit-code ../openapi/openapi.json

  frontend:
    name: Frontend (vitest + lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Typecheck (#32)
        working-directory: frontend
        run: npm run typecheck
      - name: Check generated API types freshness (#32)
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.ts
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  miniprogram:
    name: Mini program (lib unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Install dependencies
        working-directory: miniprogram
        run: npm ci
      - name: Test (vitest over the pure lib layer, mocked wx)
        working-directory: miniprogram
        run: npm test

  e2e-smoke:
    name: E2E smoke (compose API)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cissp
          POSTGRES_PASSWORD: cissp
          POSTGRES_DB: cissp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cissp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://cissp:cissp@localhost:5432/cissp
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
      JWT_SECRET: ci-smoke-jwt-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate + seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.db.seed
      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/live
      - name: Smoke
        run: |
          API_BASE_URL=http://127.0.0.1:8000 \
          SMOKE_EMAIL=admin@example.com \
          SMOKE_PASSWORD=Adminadmin1 \
          bash scripts/e2e_smoke.sh

  e2e-web:
    name: E2E web (Playwright learner journey)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cissp
          POSTGRES_PASSWORD: cissp
          POSTGRES_DB: cissp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cissp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://cissp:cissp@localhost:5432/cissp
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
      JWT_SECRET: ci-e2e-jwt-secret-at-least-32-characters
      # same as backend conftest — e2e bursts past the per-IP 600/min limit
      API_RATE_LIMIT_PER_MINUTE: "0"
      PLAYWRIGHT_API_BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate + seed + start API
        working-directory: backend
        run: |
          # Mirror the dev compose bind-mount of ./docs/questions so the
          # seed registers mockpapers and the ETL can read it from backend CWD
          # (absolute target — a relative one from backend/docs points at
          # itself).
          mkdir -p docs
          ln -sfn "${GITHUB_WORKSPACE}/docs/questions" docs/questions
          ls docs/questions
          alembic upgrade head
          python -m app.db.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/live
      - name: Install frontend deps + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright e2e (login → papers → practice/exam → wrong book)
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
