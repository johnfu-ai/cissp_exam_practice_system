# Alert rules (monitoring item #6). Fires are visible in the Prometheus UI
# (127.0.0.1:9090/alerts) and route to Alertmanager for delivery once a
# receiver is configured in alertmanager.yml.
groups:
  - name: cissp-backend
    rules:
      - alert: BackendDown
        expr: up{job="cissp-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend scrape target is down"
          description: "Prometheus has not been able to scrape backend /metrics for 2 minutes. Check `docker compose ps backend` and backend logs."

      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx rate above 2%"
          description: "More than 2% of requests have failed with 5xx for 10 minutes. Correlate via X-Request-ID in the structured logs."

      - alert: BackendHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency above 1s"
          description: "Global p95 request latency has exceeded 1 second for 10 minutes. Check DB pool saturation and slow queries."

      - alert: BackendNoSuccessfulScrape
        expr: sum_over_time(up{job="cissp-backend"}[10m]) == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Backend metrics completely unavailable for 10m"
          description: "Every scrape attempt failed for 10 minutes — the backend is likely down or /metrics is broken."
