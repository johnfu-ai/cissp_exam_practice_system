name: Release

# Release pipeline: versioned server images pushed to the registry.
# Triggered by pushing a `v*` tag (e.g. `git tag v1.4.0 && git push origin v1.4.0`).
#
# The learner clients need no CI artifacts (PRD v1.4): the web app ships as the
# frontend Docker image; the WeChat mini program is uploaded from WeChat
# DevTools (see miniprogram/README.md).
#
# Required repository configuration:
#   Variable PROD_API_BASE_URL         — e.g. https://api.example.com

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.4.0) — dry-run builds, no GH release"
        required: true
        type: string

permissions:
  contents: write # create the GitHub release
  packages: write # push images to ghcr.io

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-tag: ${{ steps.v.outputs.is-tag }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is-tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require PROD_API_BASE_URL variable
        env:
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
        run: |
          if [ -z "$PROD_API_BASE_URL" ]; then
            echo "::error::Set the repository variable PROD_API_BASE_URL (Settings → Secrets and variables → Actions → Variables) to the production API origin."
            exit 1
          fi

  docker:
    name: Server images (ghcr.io)
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-backend:latest
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:latest

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [meta, docker]
    if: needs.meta.outputs.is-tag == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            CISSP Papers ${{ needs.meta.outputs.version }}

            - Server images: `ghcr.io/${{ github.repository }}-backend:${{ needs.meta.outputs.version }}`
              and `...-frontend:${{ needs.meta.outputs.version }}` (also `:latest`).
            - WeChat mini program: build and upload from WeChat DevTools
              (`miniprogram/` — set the release API base in `lib/config.js`
              and whitelist the domain, see `miniprogram/README.md`).

            Rollback: re-deploy the compose stack with the previous image tag.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
