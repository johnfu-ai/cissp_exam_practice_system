name: CI

on:
  push:
    branches: [master, "fix/**", "feat/**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cissp
          POSTGRES_PASSWORD: cissp
          POSTGRES_DB: cissp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cissp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://cissp:cissp@localhost:5432/cissp
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (incl. no-autogenerate-drift guard + coverage threshold)
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check OpenAPI schema freshness (#32)
        working-directory: backend
        run: |
          python -m app.scripts.export_openapi ../openapi/openapi.json
          git diff --exit-code ../openapi/openapi.json

  frontend:
    name: Frontend (vitest + lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Typecheck (#32)
        working-directory: frontend
        run: npm run typecheck
      - name: Check generated API types freshness (#32)
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.ts
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    name: Mobile (analyze + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - name: Pub get
        working-directory: mobile
        run: flutter pub get
      - name: Generate l10n
        working-directory: mobile
        run: flutter gen-l10n
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Unit tests
        working-directory: mobile
        run: dart test -p vm test/
  mobile-android:
    name: Mobile (Android APK)
    runs-on: ubuntu-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000

  mobile-windows:
    name: Mobile (Windows)
    runs-on: windows-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build windows --debug --dart-define=API_BASE_URL=http://localhost:8000

  mobile-ios:
    name: Mobile (iOS unsigned)
    runs-on: macos-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - name: Build iOS (no codesign)
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build ios --debug --no-codesign --dart-define=API_BASE_URL=http://localhost:8000
